
  <!DOCTYPE html>
  <html>
  <body>
    <h1>Multicam Benchmark Runner</h1>
    <canvas id="masterCanvas" width="1920" height="1080"></canvas>
    <script>
      const { ipcRenderer } = require('electron');

      async function runMulticamBenchmark() {
        const results = {};
        const masterCanvas = document.getElementById('masterCanvas');
        const ctx = masterCanvas.getContext('2d');

        // Crear 10 fuentes de video activas sintéticas simulando cámaras físicas/remotas
        const syntheticVideos = [];
        for (let i = 1; i <= 10; i++) {
          const c = document.createElement('canvas');
          c.width = 1280;
          c.height = 720;
          document.body.appendChild(c);
          const cCtx = c.getContext('2d');
          let frame = 0;
          setInterval(() => {
            cCtx.fillStyle = 'hsl(' + ((i * 36 + frame) % 360) + ', 60%, 30%)';
            cCtx.fillRect(0, 0, 1280, 720);
            cCtx.fillStyle = '#ffffff';
            cCtx.font = 'bold 48px sans-serif';
            cCtx.fillText('CAMERA ' + i + ' FEED', 100, 360);
            frame++;
          }, 33);

          const stream = c.captureStream(30);
          const v = document.createElement('video');
          v.autoplay = true;
          v.playsInline = true;
          v.muted = true;
          document.body.appendChild(v);
          v.srcObject = stream;
          v.play().catch(() => {});
          syntheticVideos.push({ id: i, video: v, stream });
        }

        // Esperar 500ms para estabilizar streams
        await new Promise(r => setTimeout(r, 500));

        // Helper para dibujar camera cover idéntico a masterBroadcastEngine.js
        function drawCameraCover(video, x, y, w, h) {
          if (video && video.readyState >= 2) {
            const vw = video.videoWidth || 1280;
            const vh = video.videoHeight || 720;
            const videoRatio = vw / vh;
            const targetRatio = w / h;
            let sx = 0, sy = 0, sw = vw, sh = vh;
            if (videoRatio > targetRatio) {
              sw = vh * targetRatio;
              sx = (vw - sw) / 2;
            } else {
              sh = vw / targetRatio;
            }
            ctx.drawImage(video, sx, sy, sw, sh, x, y, w, h);
          } else {
            ctx.fillStyle = '#111319';
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = '#64748b';
            ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('SIN SEÑAL', x + w / 2, y + h / 2);
          }
        }

        // Benchmark de modos
        async function benchmarkMode(name, camCount, renderFn) {
          console.log('[Benchmark] Evaluando modo ' + name + ' con ' + camCount + ' cámaras...');
          const frameTimes = [];
          const startBench = performance.now();
          const targetFrames = 60;

          for (let f = 0; f < targetFrames; f++) {
            const t0 = performance.now();
            ctx.fillStyle = '#08080a';
            ctx.fillRect(0, 0, 1920, 1080);
            renderFn();
            const t1 = performance.now();
            frameTimes.push(t1 - t0);
            await new Promise(r => setTimeout(r, 16));
          }

          const totalDuration = performance.now() - startBench;
          const avgFrameTimeMs = frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length;
          const maxFrameTimeMs = Math.max(...frameTimes);
          const minFrameTimeMs = Math.min(...frameTimes);
          const effectiveFps = Math.round((targetFrames / (totalDuration / 1000)) * 10) / 10;

          return {
            mode: name,
            camerasTested: camCount,
            framesMeasured: targetFrames,
            totalDurationMs: Math.round(totalDuration),
            avgFrameTimeMs: Math.round(avgFrameTimeMs * 100) / 100,
            maxFrameTimeMs: Math.round(maxFrameTimeMs * 100) / 100,
            minFrameTimeMs: Math.round(minFrameTimeMs * 100) / 100,
            effectiveFps,
            canSustain30Fps: avgFrameTimeMs < 33.3
          };
        }

        const gap = 12;

        // 1 Cámara
        results.cam1 = await benchmarkMode('1', 1, () => {
          drawCameraCover(syntheticVideos[0].video, 0, 0, 1920, 1080);
        });

        // 2 Cámaras
        results.cam2 = await benchmarkMode('2', 2, () => {
          const halfW = (1920 - gap) / 2;
          drawCameraCover(syntheticVideos[0].video, 0, 0, halfW, 1080);
          drawCameraCover(syntheticVideos[1].video, halfW + gap, 0, halfW, 1080);
        });

        // 4 Cámaras
        results.cam4 = await benchmarkMode('4', 4, () => {
          const halfW = (1920 - gap) / 2;
          const halfH = (1080 - gap) / 2;
          drawCameraCover(syntheticVideos[0].video, 0, 0, halfW, halfH);
          drawCameraCover(syntheticVideos[1].video, halfW + gap, 0, halfW, halfH);
          drawCameraCover(syntheticVideos[2].video, 0, halfH + gap, halfW, halfH);
          drawCameraCover(syntheticVideos[3].video, halfW + gap, halfH + gap, halfW, halfH);
        });

        // 6 Cámaras
        results.cam6 = await benchmarkMode('6', 6, () => {
          const colW = (1920 - gap * 2) / 3;
          const rowH = (1080 - gap) / 2;
          for (let i = 0; i < 6; i++) {
            const col = i % 3;
            const row = Math.floor(i / 3);
            drawCameraCover(syntheticVideos[i].video, col * (colW + gap), row * (rowH + gap), colW, rowH);
          }
        });

        // 8 Cámaras
        results.cam8 = await benchmarkMode('8', 8, () => {
          const colW = (1920 - gap * 3) / 4;
          const rowH = (1080 - gap) / 2;
          for (let i = 0; i < 8; i++) {
            const col = i % 4;
            const row = Math.floor(i / 4);
            drawCameraCover(syntheticVideos[i].video, col * (colW + gap), row * (rowH + gap), colW, rowH);
          }
        });

        // 10 Cámaras
        results.cam10 = await benchmarkMode('10', 10, () => {
          const colW = (1920 - gap * 4) / 5;
          const rowH = (1080 - gap) / 2;
          for (let i = 0; i < 10; i++) {
            const col = i % 5;
            const row = Math.floor(i / 5);
            drawCameraCover(syntheticVideos[i].video, col * (colW + gap), row * (rowH + gap), colW, rowH);
          }
        });

        // Prueba de Resiliencia: Pérdida súbita de cámara 3 (stream desconectado/null)
        console.log('[Benchmark] Evaluando resiliencia: pérdida súbita de cámara...');
        syntheticVideos[2].video.srcObject = null;
        results.camLossRecovery = await benchmarkMode('loss_test_10_cams', 10, () => {
          const colW = (1920 - gap * 4) / 5;
          const rowH = (1080 - gap) / 2;
          for (let i = 0; i < 10; i++) {
            const col = i % 5;
            const row = Math.floor(i / 5);
            drawCameraCover(syntheticVideos[i].video, col * (colW + gap), row * (rowH + gap), colW, rowH);
          }
        });

        // Reconexión de cámara 3
        syntheticVideos[2].video.srcObject = syntheticVideos[2].stream;
        await syntheticVideos[2].video.play().catch(() => {});
        results.camReconnected = await benchmarkMode('reconnected_10_cams', 10, () => {
          const colW = (1920 - gap * 4) / 5;
          const rowH = (1080 - gap) / 2;
          for (let i = 0; i < 10; i++) {
            const col = i % 5;
            const row = Math.floor(i / 5);
            drawCameraCover(syntheticVideos[i].video, col * (colW + gap), row * (rowH + gap), colW, rowH);
          }
        });

        ipcRenderer.send('multicam-test-finished', results);
      }

      runMulticamBenchmark();
    </script>
  </body>
  </html>
