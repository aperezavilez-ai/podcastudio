name: Project isolation

on:
  push:
  pull_request:

jobs:
  validate-isolation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate project manifest
        run: node .project-governance/validate-project-isolation.mjs

