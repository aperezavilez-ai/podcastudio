<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="icon" type="image/x-icon" href="/icon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PodcastStudio</title>
    <style>
      html, body { margin: 0; padding: 0; background-color: #0a0a0a !important; background: #0a0a0a !important; color: #fff; overflow: hidden; }
      @keyframes pulseSlow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.85; transform: scale(0.98); } }
    </style>
    <script>
      // Purga automática de Service Workers y cachés obsoletos
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) {
            caches.delete(keys[i]);
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div style="height:100vh;width:100vw;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;user-select:none;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;animation:pulseSlow 2s infinite ease-in-out;">
          <div style="background:linear-gradient(135deg, #ff6b00, #ea580c);border-radius:10px;padding:9px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(234,88,12,0.4);">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" x2="12" y1="19" y2="22"/>
            </svg>
          </div>
          <span style="font-size:26px;font-weight:900;letter-spacing:-0.5px;color:#fff;">Podcast<span style="color:#ff6b00;">Studio</span></span>
        </div>
        <div style="font-size:11px;color:#71717a;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;">Iniciando Motor Broadcast...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
